[project]
name = "ndh-canvas-adapter-enhanced"
version = "1.0.0"
description = "An explicit geometric interpretability substrate and structural canvas control architecture designed to interface high-dimensional Riemannian phase spaces with deterministic studio practice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Protective Open-Source Ethical Architecture" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Artistic Software",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.10.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=64.0.0"]
build-backend = "setuptools.build_meta"

# ====================================================================
# STRUCTURAL PACKAGING SOURCE LAYOUT CONFIGURATION
# ====================================================================

[tool.setuptools.packages.find]
where = ["src"]
include = ["ndh_canvas_adapter*"]

# ====================================================================
# STYLISTIC VERIFICATION AND FORMATTER UTILITIES
# ====================================================================

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["ndh_canvas_adapter"]
